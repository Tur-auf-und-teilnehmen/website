<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>PulseLine QR</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#05070d;color:#eef3ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0%,rgba(57,100,255,.16),transparent 28%),radial-gradient(circle at 85% 20%,rgba(141,82,255,.13),transparent 26%),linear-gradient(180deg,#05070d,#080b13 55%,#05070d)}
    main{width:min(760px,94vw);text-align:center;padding:34px;border:1px solid rgba(255,255,255,.08);border-radius:28px;background:rgba(10,14,24,.8);box-shadow:0 30px 90px rgba(0,0,0,.38)}
    .eyebrow{font-size:11px;letter-spacing:.24em;color:#6ee7ff;font-weight:800}
    h1{font-size:clamp(38px,7vw,74px);line-height:.95;margin:10px 0 14px;background:linear-gradient(90deg,#fff,#6ee7ff,#9f8cff);-webkit-background-clip:text;color:transparent;letter-spacing:-.05em}
    p{margin:0 0 26px;color:#aab6cd;font-size:18px}
    .qr{display:inline-block;background:#fff;padding:22px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .qr img{display:block;width:min(58vw,420px);height:auto}
    .url{margin-top:22px;font-size:clamp(16px,3vw,22px);word-break:break-all;color:#d7f8ff}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">TÜR AUF UND TEILNEHMEN</div>
    <h1>PulseLine</h1>
    <p>Scannen und direkt in die Live-Ansicht springen.</p>
    <div class="qr">
      <img src="assets/pulseline-live-qr.svg" alt="QR-Code zur PulseLine Live-Ansicht" />
    </div>
    <div class="url">https://pulseline.tonirenner.de/live</div>
  </main>
</body>
</html>
