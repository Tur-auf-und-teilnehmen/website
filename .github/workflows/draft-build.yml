name: Draft website build

on:
  push:
    branches:
      - feature/2-website-refresh
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Eleventy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify
        run: npm run build
      - name: Upload preview files
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist/
          retention-days: 7
